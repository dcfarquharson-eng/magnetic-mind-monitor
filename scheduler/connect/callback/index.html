<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finishing connection - Magnetic Mind Social Scheduler</title>
    <meta name="description" content="Finishing your account connection to the Magnetic Mind Social Scheduler.">
    <meta name="robots" content="noindex">
    <meta name="referrer" content="no-referrer">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: 'Outfit', Arial, sans-serif; color: #e6f1ff;
               background: radial-gradient(900px 500px at 80% -10%, rgba(197,160,89,.18), transparent 60%), #0a192f; }
        .box { text-align: center; padding: 2rem; max-width: 460px; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(230,241,255,.1); border-top-color: #c5a059; border-radius: 50%; margin: 0 auto 1.2rem; animation: spin 1s linear infinite; }
        h1 { font-size: 1.4rem; margin: 0 0 .4rem; }
        p { color: #a8b2d1; margin: 0; }
        a { color: #c5a059; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <main class="box">
        <div class="spinner" id="spinner"></div>
        <h1 id="cb-title">Finishing your connection...</h1>
        <p id="cb-text">This takes a few seconds.</p>
    </main>
    <script>
    (function () {
        var API = "https://backend-deploy-hlq8.onrender.com/api/sched";
        var PORTAL = "/scheduler/connect/";
        var q = new URLSearchParams(location.search);
        var code = q.get("code"), state = q.get("state") || "";
        var error = q.get("error_description") || q.get("error_message") || q.get("error");
        var session = localStorage.getItem("sched_session");
        history.replaceState(null, "", location.pathname);   // keep the one-time code out of history

        function back(param, value) { location.replace(PORTAL + "?" + param + "=" + encodeURIComponent(value)); }

        if (error) return back("err", "The connection was cancelled or not allowed (" + error.replace(/\+/g, " ") + ").");
        if (!code || !state) return back("err", "The sign-in page did not return a code. Please press Connect again.");
        if (!session) return back("err", "Please sign in to the portal first, then press Connect again.");

        var slow = setTimeout(function () { document.getElementById("cb-text").textContent = "Waking up the server, this can take up to a minute..."; }, 4000);
        fetch(API + "/connect/exchange", {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-Sched-Session": session },
            body: JSON.stringify({ code: code, state: state })
        }).then(function (r) {
            return r.json().catch(function () { return {}; }).then(function (d) {
                clearTimeout(slow);
                if (!r.ok) return back("err", d.detail || ("Error " + r.status));
                back("done", d.provider || state.split(".")[0]);
            });
        }).catch(function () { clearTimeout(slow); back("err", "Could not reach the server. Please press Connect again."); });
    })();
    </script>
</body>
</html>

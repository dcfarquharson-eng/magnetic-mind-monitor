<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting to TikTok… | The Magnetic Mind Institute</title>
    <meta name="robots" content="noindex">
    <style>
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #0a192f; color: #e6f1ff; font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
        }
        .box {
            max-width: 460px; padding: 2rem; border-radius: 14px; text-align: center;
            background: #112240; border: 1px solid rgba(197, 160, 89, 0.3);
        }
        h1 { font-size: 1.3rem; font-weight: 500; color: #c5a059; margin-top: 0; }
        .spin {
            width: 34px; height: 34px; margin: 0 auto 1rem; border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.15); border-top-color: #FE2C55; animation: s 0.9s linear infinite;
        }
        @keyframes s { to { transform: rotate(360deg); } }
        a { color: #c5a059; }
    </style>
</head>

<body>
    <div class="box">
        <div class="spin" id="spin"></div>
        <h1 id="msg">Connecting your TikTok account…</h1>
        <p id="detail" style="color:#8892b0"></p>
    </div>
    <script>
        (async () => {
            const API = localStorage.getItem('studio_api') || 'https://backend-deploy-hlq8.onrender.com';
            const q = new URLSearchParams(location.search);
            const fail = (m) => {
                document.getElementById('spin').style.display = 'none';
                document.getElementById('msg').textContent = 'Could not connect to TikTok';
                document.getElementById('detail').innerHTML = m + '<br><br><a href="/creator-studio.html">Back to Creator Studio</a>';
            };
            if (q.get('error')) return fail(q.get('error_description') || q.get('error'));
            if (!q.get('code') || !q.get('state')) return fail('Missing authorization code.');
            try {
                const r = await fetch(API + '/api/tiktok/exchange', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: q.get('code'), state: q.get('state') })
                });
                const j = await r.json();
                if (!r.ok) return fail(j.detail || ('HTTP ' + r.status));
                localStorage.setItem('tt_studio_session', j.session_id);
                location.replace('/creator-studio.html');
            } catch (e) {
                fail('Network error: ' + e.message);
            }
        })();
    </script>
</body>

</html>
